<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    header nav button { background: #57534e; color: #f5f5f4; border: none; cursor: pointer; }
    header nav button.active { background: #a16207; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button, select { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    .dead { color: #fca5a5; } .valid { color: #86efac; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .msg { min-height: 1.4em; color: #fcd34d; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav id="nav" hidden>
      <button id="navReadings" class="active">班测</button>
      <button id="navCerts">校准证</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。上报必须绑定未作废且未过期的仪器校准证。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报、可建证；viewer / view123456 只能看</p>
    </section>

    <section id="app" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <select id="certSelect" required></select>
        <button>上报</button>
      </form>
      <p id="certHint" class="msg" hidden></p>
      <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
    </section>

    <section id="certs" hidden>
      <h2>校准证册</h2>
      <form id="certForm">
        <input id="instrumentNo" placeholder="仪器编号" />
        <input id="validUntil" type="date" />
        <button>新建校准证</button>
      </form>
      <p id="certMsg" class="msg"></p>
      <table>
        <thead><tr><th>仪器编号</th><th>有效截止日</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="certRows"></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
